plugins {
    id 'java-library'
    id "com.vanniktech.maven.publish" version "0.37.0"
}

group = 'sh.fyz'
version = '2.2.5'

tasks.withType(JavaCompile).configureEach {
    // Any JDK 21+ can build; the bytecode and the JDK API used stay at Java 21.
    options.release = 21
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
}

sourceSets {
    examples {
        java {
            srcDir 'src/examples/java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    examplesImplementation.extendsFrom implementation, api
    examplesRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    api "org.hibernate.orm:hibernate-core:7.4.11.Final"
    api "jakarta.persistence:jakarta.persistence-api:3.2.0"

    // Without this module Hibernate cannot find its Hikari ConnectionProvider: it ignores every
    // hibernate.hikari.* setting and silently falls back to its built-in, non-production pool.
    implementation "org.hibernate.orm:hibernate-hikaricp:7.4.11.Final"
    implementation "com.zaxxer:HikariCP:7.1.0"
    // api: RedisManager's public getJedisPool() and getObjectMapper() return their types.
    api 'redis.clients:jedis:8.0.1'
    implementation 'org.apache.commons:commons-pool2:2.13.1'
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    // java.time fields (LocalDateTime, Instant...) cannot be cached in Redis without it.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.3'
    implementation 'io.github.classgraph:classgraph:4.8.196'

    examplesRuntimeOnly 'org.postgresql:postgresql:42.7.13'

    testImplementation 'org.postgresql:postgresql:42.7.13'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mavenPublishing {
    publishToMavenCentral()

    pom {
        name = 'Architect'
        description = 'A lightweight Java ORM framework built on Hibernate with optional Redis caching and pub/sub relay.'
        url = 'https://fyz.sh'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }
        developers {
            developer {
                id = "fyz"
                name = "Thibeau Benet"
                url = "https://github.com/w8fyz"
            }
        }
        scm {
            url = "https://github.com/w8fyz/Architect"
            connection = "scm:git:git://github.com/w8fyz/Architect.git"
            developerConnection = "scm:git:ssh://git@github.com/w8fyz/Architect.git"
        }
    }

    signAllPublications()
}

signing {
    useGpgCmd()
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

jar {
    from(sourceSets.main.output)
    exclude 'sh/fyz/architect/examples/**'
}

tasks.register('runMigrationToolDemo', JavaExec) {
    group = 'application'
    description = 'Runs the Migration Tool Swing demo (requires PostgreSQL).'
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'sh.fyz.architect.examples.MigrationToolDemo'
}
