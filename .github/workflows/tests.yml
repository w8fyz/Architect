name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: architect
          POSTGRES_PASSWORD: architect
          POSTGRES_DB: architect_test
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U architect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Redis password
        run: docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass architect

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5440
          DB_NAME: architect_test
          DB_USER: architect
          DB_PASS: architect
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          REDIS_PASS: architect
        run: ./gradlew test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 7
